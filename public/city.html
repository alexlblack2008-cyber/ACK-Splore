<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Right-of-Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#E6EAE1; --panel:#F5F6F1; --panel-2:#ECEFE7; --ink:#1E2B38; --ink-2:#56626E; --rule:#C7CEC3;
  --hivis:#E8590C; --hivis-ink:#FFFFFF; --water:#8DB8C7;
  --good:#2F7D4F; --warn:#B7790A; --bad:#BF3A2B;
  --zr:#EFD77A; --zc:#E39A96; --zi:#B4A2D6;
  --display:"Overpass","Highway Gothic","Arial Narrow",system-ui,sans-serif;
  --mono:"Overpass Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--display);}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--hivis);outline-offset:2px}

.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-inline:16px;border-bottom:2px solid var(--ink);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{margin:0;font-weight:900;font-size:22px;letter-spacing:-.01em;text-transform:uppercase}
.brand h1 span{display:inline-block;background:var(--hivis);color:var(--hivis-ink);padding:0 6px;margin-left:2px;transform:skewX(-8deg)}
.brand small{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat b{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stat b.neg{color:var(--bad)}
.speed{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.speed button{background:transparent;border:0;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer;border-right:1.5px solid var(--ink)}
.speed button:last-child{border-right:0}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

.app{display:grid;grid-template-columns:210px minmax(0,1fr) 320px;gap:14px;padding-inline:16px;padding-block:14px;max-width:1680px;margin:0 auto;align-items:start}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px}
.panel h2{margin:0;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 em{font-style:normal;font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.pbody{padding:10px 12px}

/* tools */
.tools{display:flex;flex-direction:column;gap:10px}
.tgroup{display:flex;flex-direction:column;gap:3px}
.tgroup > span{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:0 2px}
.tool{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:5px 7px;cursor:pointer}
.tool:hover{border-color:var(--ink-2)}
.tool[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.tool[disabled]{opacity:.45;cursor:not-allowed}
.tool .sw{width:22px;height:18px;border-radius:3px;border:1px solid rgba(0,0,0,.25);display:grid;place-items:center;font:600 9px/1 var(--mono);color:#1E2B38}
.tool .nm{font-weight:600;font-size:13px;line-height:1.15;white-space:nowrap}
.tool .cs{font-family:var(--mono);font-size:11px;opacity:.75;white-space:nowrap}
.tool kbd{font-family:var(--mono);font-size:10px;opacity:.55}
.tooldesc{font-size:12px;color:var(--ink-2);min-height:3.2em}

/* map */
.mapwrap{display:flex;flex-direction:column;gap:8px;min-width:0}
.maptop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.maptop > span{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-right:4px}
.chip{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.canvasbox{position:relative;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:#DDE3D3;line-height:0}
canvas#map{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
.titleblock{position:absolute;right:0;bottom:0;background:rgba(245,246,241,.94);border-left:1.5px solid var(--ink);border-top:1.5px solid var(--ink);font:11px/1.3 var(--mono);padding:5px 9px;pointer-events:none;line-height:1.35}
.titleblock b{font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.news{display:flex;flex-direction:column;gap:2px;font-size:12.5px;max-height:120px;overflow:auto;padding:8px 12px}
.news div{display:grid;grid-template-columns:74px 1fr;gap:8px}
.news time{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.news .bad{color:var(--bad);font-weight:600}
.news .good{color:var(--good);font-weight:600}

/* side */
.side{display:flex;flex-direction:column;gap:12px}
.wo{display:flex;flex-direction:column}
.wo-item{display:grid;grid-template-columns:4px 1fr auto;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule);align-items:center;cursor:pointer}
.wo-item:last-child{border-bottom:0}
.wo-item:hover{background:var(--panel-2)}
.wo-item .sev{align-self:stretch;border-radius:2px;background:var(--warn)}
.wo-item .sev.s3{background:var(--bad)}
.wo-item b{display:block;font-size:13px}
.wo-item small{display:block;font-size:11.5px;color:var(--ink-2);font-family:var(--mono)}
.btn{border:1.5px solid var(--ink);background:var(--panel);border-radius:4px;padding:4px 9px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.hv{background:var(--hivis);border-color:var(--hivis);color:var(--hivis-ink)}
.btn.hv:hover{filter:brightness(.95)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.status-pill{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel-2);border:1px solid var(--rule);white-space:nowrap}
.empty{padding:12px;color:var(--ink-2);font-size:12.5px}

.grades{display:grid;grid-template-columns:1fr auto;gap:0}
.grades div{padding:6px 12px;border-bottom:1px solid var(--rule);font-size:13px;display:flex;flex-direction:column}
.grades div small{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.grades .g{font:900 20px/1 var(--display);display:grid;place-items:center;width:44px}
.g.A{color:var(--good)}.g.B{color:#5E8C2E}.g.C{color:var(--warn)}.g.D{color:#C8601A}.g.F{color:var(--bad)}.g.NA{color:var(--ink-2);font-size:13px}

.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.kv .tot{border-top:1px solid var(--rule);padding-top:4px;font-weight:600;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row label{font-size:12px;font-weight:600}
input[type=range]{accent-color:var(--hivis);flex:1;min-width:90px}

.rci{display:flex;gap:14px;align-items:flex-end;height:74px;padding:6px 12px 10px}
.rci .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.rci .track{flex:1;width:100%;position:relative;border-left:1px solid var(--rule);border-right:1px solid var(--rule);background:linear-gradient(var(--rule),var(--rule)) center/100% 1px no-repeat}
.rci .fill{position:absolute;left:18%;right:18%;border-radius:2px}
.rci span{font-size:11px;font-weight:800}

.insp{font-size:12.5px}
.insp h3{margin:0 0 4px;font-size:15px;font-weight:800}
.insp p{margin:6px 0 0;color:var(--ink-2)}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--rule);margin:2px 3px 0 0}
.tag.ok{color:var(--good);border-color:currentColor}.tag.no{color:var(--bad);border-color:currentColor}

.modal{position:fixed;inset:0;background:rgba(30,43,56,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{background:var(--panel);border:2px solid var(--ink);border-radius:6px;max-width:520px;width:100%;padding:18px 20px}
.modal h3{margin:0 0 8px;font-size:20px;font-weight:900;text-transform:uppercase}
.modal p,.modal li{font-size:13.5px}
.modal ul{padding-left:18px;margin:8px 0}

@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .side{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .tools{flex-direction:row;flex-wrap:wrap}
  .tgroup{flex:1 1 100%}
  .tgroup .list{display:flex;flex-wrap:wrap;gap:4px}
  .tool{width:auto;grid-template-columns:18px auto auto}
  .tool kbd{display:none}
  .legend{margin-left:0}
  .brand{margin-right:0;width:100%}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><h1>Right<span>of Way</span></h1><small id="cityname">City of Millbrook · Dept. of Public Works</small></div>
  <div class="stats">
    <div class="stat"><b id="sDate">—</b><i>Date</i></div>
    <div class="stat"><b id="sFunds">—</b><i>Treasury</i></div>
    <div class="stat"><b id="sPop">—</b><i>Residents</i></div>
    <div class="stat"><b id="sJobs">—</b><i>Jobs</i></div>
    <div class="stat"><b id="sHappy">—</b><i>Approval</i></div>
    <div class="stat"><b id="sCrew">—</b><i>Crews free</i></div>
  </div>
  <div class="speed" role="group" aria-label="Simulation speed">
    <button id="sp0" data-sp="0">Pause</button><button id="sp1" data-sp="1">1×</button><button id="sp2" data-sp="3">3×</button>
  </div>
</header>

<main class="app">
  <aside class="panel">
    <h2>Toolbox <em id="toolKey"></em></h2>
    <div class="pbody">
      <div class="tools" id="tools"></div>
      <p class="tooldesc" id="toolDesc"></p>
      <div class="row"><button class="btn" id="helpBtn">How to play</button><button class="btn" id="newBtn">New city</button></div>
    </div>
  </aside>

  <section class="mapwrap">
    <div class="maptop" id="overlays">
      <span>Map layer</span>
    </div>
    <div class="canvasbox">
      <canvas id="map" aria-label="City map"></canvas>
      <div class="titleblock" id="titleblock"></div>
    </div>
    <div class="panel"><h2>Dispatch log <em>newest first</em></h2><div class="news" id="news"></div></div>
  </section>

  <aside class="side">
    <div class="panel">
      <h2>Work orders <em id="woCount"></em></h2>
      <div class="wo" id="wo"></div>
    </div>
    <div class="panel">
      <h2>Inspector <em id="inspXY"></em></h2>
      <div class="pbody insp" id="insp"></div>
    </div>
    <div class="panel">
      <h2>Infrastructure report card <em id="gpa"></em></h2>
      <div class="grades" id="grades"></div>
    </div>
    <div class="panel">
      <h2>Zoning demand</h2>
      <div class="rci" id="rci"></div>
    </div>
    <div class="panel">
      <h2>Monthly budget <em id="budgetMonth"></em></h2>
      <div class="pbody">
        <dl class="kv" id="budget"></dl>
        <div class="row"><label for="tax">Property tax</label><input type="range" id="tax" min="5" max="15" step="1"><b id="taxv" style="font-family:var(--mono)"></b></div>
        <div class="row"><button class="btn" id="bondBtn">Issue $10k bond</button><small id="bondInfo" style="color:var(--ink-2);font-size:11.5px"></small></div>
      </div>
    </div>
  </aside>
</main>

<div class="modal" id="modal" hidden><div class="card" id="modalCard"></div></div>

<script>
"use strict";
// ─── constants ───────────────────────────────────────────────────────────────
const W = 48, H = 32, T = 20;
const GRASS = 0, WATER = 1, FOREST = 2;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const START_YEAR = 2027;
const SAVE_KEY = "right-of-way-city-v1";

const ZONE = {
  R: { pop: [0, 12, 30, 60], jobs: [0, 0, 0, 0] },
  C: { pop: [0, 0, 0, 0], jobs: [0, 8, 20, 40] },
  I: { pop: [0, 0, 0, 0], jobs: [0, 12, 28, 45] },
};
const CAP = { power: 60, pump: 0.30, sewage: 0.26 };        // MW, MGD, MGD
const UPKEEP = { road: 1, ave: 2, bridge: 8, power: 150, pump: 80, sewage: 100, fire: 60, depot: 70, park: 5, levee: 1 };
const ROAD_CAP = { road: 60, ave: 160, bridge: 60 };          // vehicles per peak hour
const RADIUS = { fire: 7, depot: 8, park: 4 };

const TOOLS = [
  { id: "inspect", name: "Inspect", group: "Survey", cost: 0, key: "q", sw: "#FFFFFF", glyph: "?", desc: "Click any tile to read pavement condition (PCI), bridge rating, V/C ratio and utility service." },
  { id: "road", name: "Street", group: "Transport", cost: 50, key: "1", sw: "#6E737A", desc: "Two-lane street, $50 per tile. Drag to lay a run. Streets are the right-of-way for power lines and water and sewer mains. Over the river it becomes a bridge ($600)." },
  { id: "ave", name: "Avenue", group: "Transport", cost: 250, key: "2", sw: "#474B52", unlock: 500, desc: "Widen a street to a 4-lane avenue. Capacity goes from 60 to 160 vehicles per hour. Unlocks at 500 residents." },
  { id: "R", name: "Residential", group: "Zoning", cost: 20, key: "3", sw: "#EFD77A", glyph: "R", desc: "Zone for housing. Grows when it has street access, power and water, and people want to move in." },
  { id: "C", name: "Commercial", group: "Zoning", cost: 20, key: "4", sw: "#E39A96", glyph: "C", desc: "Zone for shops and offices. Needs residents nearby to shop there." },
  { id: "I", name: "Industrial", group: "Zoning", cost: 20, key: "5", sw: "#B4A2D6", glyph: "I", desc: "Zone for factories. Lots of jobs, but pollution lowers nearby home values." },
  { id: "power", name: "Power plant", group: "Utilities", cost: 3000, key: "6", sw: "#F2C14E", glyph: "PW", desc: "60 MW gas plant. Power flows along connected streets, so the plant must touch the network it feeds." },
  { id: "pump", name: "Water plant", group: "Utilities", cost: 1500, key: "7", sw: "#8DB8C7", glyph: "WT", desc: "0.30 MGD intake and treatment plant. Must sit on the riverbank next to a street." },
  { id: "sewage", name: "Sewage plant", group: "Utilities", cost: 2500, key: "8", sw: "#9FA88A", glyph: "WW", desc: "0.26 MGD treatment plant on the riverbank. Without enough capacity, sewers overflow and the state fines the city." },
  { id: "fire", name: "Fire station", group: "Services", cost: 1200, key: "9", sw: "#D9534F", glyph: "FD", desc: "Puts out fires within 7 tiles before they spread." },
  { id: "depot", name: "Works depot", group: "Services", cost: 1000, key: "0", sw: "#E8590C", glyph: "DPW", desc: "Adds a repair crew and runs preventive maintenance on streets and bridges within 8 tiles. Preventive work costs far less than emergency repair." },
  { id: "park", name: "Park", group: "Services", cost: 200, key: "p", sw: "#7FB069", glyph: "♣", desc: "Raises approval and home values within 4 tiles." },
  { id: "levee", name: "Levee", group: "Services", cost: 150, key: "l", sw: "#A78B63", glyph: "LV", desc: "Earthen embankment on the riverbank. Protects this tile and its neighbors from floods." },
  { id: "repair", name: "Repair", group: "Maintain", cost: 0, key: "e", sw: "#FFFFFF", glyph: "🔧", desc: "Resurface a street or rehab a bridge back to full condition. Emergency rates: $6 per point on streets, $25 per point on bridges." },
  { id: "bulldoze", name: "Demolish", group: "Maintain", cost: 10, key: "x", sw: "#FFFFFF", glyph: "✕", desc: "Clear a tile. $10 per tile." },
];
const TOOL = Object.fromEntries(TOOLS.map(t => [t.id, t]));

const INC = {
  main:   { name: "Water main break",   days: 3,  cost: 800,  sev: 2, desc: "A cast-iron main failed under the street. Water can't flow past this point, and the city loses $25 a day in treated water." },
  sink:   { name: "Sinkhole",           days: 5,  cost: 1500, sev: 3, desc: "The roadway collapsed. Traffic, power and water can't pass this tile." },
  bridge: { name: "Bridge closed",      days: 12, cost: 6000, sev: 3, desc: "Inspection rated this bridge structurally deficient. It is closed to traffic. If it keeps deteriorating it will collapse." },
  plant:  { name: "Power plant trip",   days: 4,  cost: 2000, sev: 3, desc: "A turbine tripped offline. Everything this plant fed is on reduced supply." },
  lines:  { name: "Power line down",    days: 2,  cost: 400,  sev: 2, desc: "Storm damage. Power can't pass this tile." },
  pump:   { name: "Water plant failure",days: 3,  cost: 1200, sev: 3, desc: "High-service pumps failed. This plant isn't producing water." },
  flood:  { name: "Flooded facility",   days: 6,  cost: 2500, sev: 3, desc: "Floodwater got into the plant. It's offline until it's pumped out and rebuilt." },
  fire:   { name: "Structure fire",     days: 1,  cost: 600,  sev: 2, desc: "No fire station covers this block, so the fire is spreading. Call mutual aid from a neighboring town, or build a fire station." },
};

const MILESTONES = [
  { pop: 500,  text: "Avenues unlocked. Widen busy streets before they hit LOS F.", grant: 0 },
  { pop: 900,  text: "Town charter granted. State grant of $5,000.", grant: 5000 },
  { pop: 1500, text: "City status reached. Federal infrastructure grant of $15,000.", grant: 15000 },
  { pop: 4000, text: "Regional hub. Metropolitan planning grant of $30,000.", grant: 30000 },
];

// ─── state ───────────────────────────────────────────────────────────────────
let S;          // game state
let tool = "inspect", overlay = "base", speed = 1;
let hover = null, sel = null, painting = false, lastPaint = -1;

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const idx = (x, y) => y * W + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const hash = (x, y) => (((x * 928371 + y * 123457) ^ (x * y * 7919)) >>> 0) % 997 / 997;
const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function newTile(ter) { return { ter, b: null, lvl: 0, cond: 100, load: 0, pw: false, wt: false, sw: false, fW: false, fP: false, sink: false, closed: false, off: false, fire: 0, flood: 0, bad: 0 }; }
const T_ = (x, y) => S.tiles[idx(x, y)];
const isRoad = t => t && (t.b === "road" || t.b === "ave" || t.b === "bridge");
const isZone = t => t && (t.b === "R" || t.b === "C" || t.b === "I");
const riverAt = y => 33 + Math.round(3 * Math.sin(y / 4.5) + 1.5 * Math.sin(y / 2.1));

function newCity(seed = 7) {
  const rnd = mulberry32(seed);
  S = { day: 0, funds: 25000, tax: 9, bonds: [], tiles: [], inc: [], news: [], nextId: 1, milestones: 0,
        happy: 65, heat: 0, month: null, history: [], ledger: { maint: 0, emergency: 0, fines: 0, water: 0 } };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const rc = riverAt(y);
    let ter = (x >= rc - 1 && x <= rc + 1) ? WATER : GRASS;
    if (ter === GRASS) {
      const f = Math.sin(x * 0.45 + seed) * Math.cos(y * 0.5) + rnd() * 0.6;
      if (f > 0.95 || (x > 40 && rnd() < 0.35) || (y < 4 && x > 20 && rnd() < 0.3)) ter = FOREST;
    }
    S.tiles.push(newTile(ter));
  }
  const put = (x, y, b, extra = {}) => { const t = T_(x, y); if (b === "road" && t.ter === WATER) b = "bridge"; else if (t.ter === WATER) return; if (t.ter === FOREST) t.ter = GRASS; Object.assign(t, { b }, extra); };
  const ex = riverAt(15) - 2;                       // last land tile before river on Main St
  for (let x = 3; x < ex; x++) put(x, 15, "road");
  put(2, 15, "power"); put(ex, 15, "pump");
  for (let y = 9; y <= 21; y++) { put(9, y, "road"); put(17, y, "road"); }
  for (let y = 11; y <= 19; y++) put(24, y, "road");
  for (let x = 9; x <= 17; x++) { put(x, 9, "road"); put(x, 21, "road", { cond: 38 + rnd() * 10 }); }
  for (let x = 25; x <= 42; x++) put(x, 12, "road", { cond: T_(x, 12).ter === WATER ? 36 : 70 });
  // zoning

    const nm = { R: "Residential", C: "Commercial", I: "Industrial" }[t.b], lv = ["Vacant lot", "Low density", "Medium density", "High density"][t.lvl];
    h += `<h3>${nm} · ${lv}</h3><dl class="kv"><dt>${t.b === "R" ? "Residents" : "Jobs"}</dt><dd>${t.b === "R" ? ZONE.R.pop[t.lvl] : ZONE[t.b].jobs[t.lvl]}</dd><dt>Power draw</dt><dd>${demandOf(t, "power").toFixed(2)} MW</dd><dt>Water use</dt><dd>${Math.round(demandOf(t, "water") * 1e6).toLocaleString()} gpd</dd></dl>`;
    h += `<p>${tag(access(x, y), "Street")}${tag(t.pw, "Power")}${tag(t.wt, "Water")}${tag(t.sw, "Sewer")}${tag(inRadius(x, y, "fire", RADIUS.fire), "Fire cover")}</p>`;
    if (!access(x, y)) h += `<p>Needs a street on one side to develop.</p>`;
    else if (!t.pw || !t.wt) h += `<p>Missing utilities. Check the Power and Water layers for breaks or plants running over capacity.</p>`;
    else if (t.lvl === 2 && !t.sw) h += `<p>Needs sewer service to grow past medium density.</p>`;
  } else if (t.b) {
    const tl = TOOL[t.b]; h += `<h3>${tl.name}</h3><dl class="kv"><dt>Status</dt><dd>${t.off ? "Offline" : t.link === false ? "Not on a street" : "Operating"}</dd><dt>Upkeep</dt><dd>${money(UPKEEP[t.b] || 0)}/mo</dd>`;
    if (CAP[t.b]) { const m = { power: "power", pump: "water", sewage: "sewer" }[t.b], n = S.net[m], u = t.b === "power" ? "MW" : "MGD";
      h += `<dt>Rated capacity</dt><dd>${CAP[t.b]} ${u}</dd><dt>Citywide load</dt><dd>${n.supply ? Math.round(n.demand / n.supply * 100) : "—"}%</dd>`; }
    h += `</dl><p>${tl.desc}</p>`;
  } else {
    h += `<h3>${t.ter === WATER ? "Mill River" : t.ter === FOREST ? "Woodland" : "Open land"}</h3><p>${t.ter === WATER ? "Lay a street across to build a bridge. Build water and wastewater plants on the bank." : t.ter === FOREST ? "Clearing adds $30 to anything built here." : "Undeveloped parcel."}</p>`;
  }
  if (inc) { const d = INC[inc.kind]; h += `<p style="color:var(--bad)"><b>${d.name}.</b> ${d.desc}</p>`; }
  el.innerHTML = h;
}
function renderWO() {
  const open = S.inc.filter(i => i.status !== "done").sort((a, b) => (a.status === "crew") - (b.status === "crew") || INC[b.kind].sev - INC[a.kind].sev || a.start - b.start);
  const c = crews();
  $("woCount").textContent = `${open.length} open`;
  $("wo").innerHTML = open.length ? open.map(i => { const d = INC[i.kind], age = S.day - i.start;
    const act = i.status === "crew" ? `<span class="status-pill">On site · ${i.left}d</span>`
      : `<button class="btn hv" data-dispatch="${i.id}" ${(i.kind !== "fire" && c.free <= 0) || S.funds < d.cost ? "disabled" : ""}>${i.kind === "fire" ? "Mutual aid" : "Dispatch"} ${money(d.cost)}</button>`;
    return `<div class="wo-item" data-goto="${i.x},${i.y}"><span class="sev s${d.sev}"></span><div><b>${d.name}</b><small>${street(i.x, i.y)} · open ${age}d${i.kind === "bridge" ? " · NBI " + nbi(T_(i.x, i.y).cond) : ""}</small></div>${act}</div>`; }).join("")
    : `<div class="empty">No open work orders. Use the quiet time to repair streets before they fail.</div>`;
}
function renderGrades() {
  let sum = 0, n = 0;
  $("grades").innerHTML = S.grades.map(([name, detail, score]) => { const L = letter(score); if (score != null) { sum += clamp(score, 0, 100); n++; }
    return `<div><span>${name}</span><small>${detail}</small></div><div class="g ${L}">${L === "NA" ? "n/a" : L}</div>`; }).join("");
  $("gpa").textContent = n ? `overall ${letter(sum / n)}` : "";
}
function renderRCI() {
  $("rci").innerHTML = [["R", COL.Rb], ["C", COL.Cb], ["I", COL.Ib]].map(([k, c]) => { const v = S.demand[k], h = Math.abs(v) * 50;
    return `<div class="bar"><div class="track"><div class="fill" style="background:${c};${v >= 0 ? `bottom:50%;height:${h}%` : `top:50%;height:${h}%;opacity:.45`}"></div></div><span>${k}</span></div>`; }).join("");
}
function renderBudget() {
  const m = S.month;
  $("budgetMonth").textContent = m ? m.label : "first report at month end";
  const est = { rev: Math.round(S.pop * S.tax * 0.22 + S.jobs * S.tax * 0.16), fees: Math.round(S.pop * S.net.water.served * 0.35), up: upkeep() };
  const rows = m ? [["Property & business tax", m.rev], ["Water & sewer fees", m.fees], ["Operations & upkeep", -m.up], ["Preventive maintenance", -m.maint], ["Emergency repairs", -m.emergency], ["Water lost to breaks", -m.water], ["Fines & settlements", -m.fine], ["Debt service", -m.debt]]
    : [["Est. tax revenue", est.rev], ["Est. water & sewer fees", est.fees], ["Est. upkeep", -est.up]];
  const net = m ? m.net : est.rev + est.fees - est.up;
  $("budget").innerHTML = rows.filter(r => r[1] !== 0 || !m).map(([k, v]) => `<dt>${k}</dt><dd>${money(v)}</dd>`).join("") + `<dt class="tot">Net</dt><dd class="tot" style="color:${net < 0 ? "var(--bad)" : "var(--good)"}">${money(net)}</dd>`;
  $("tax").value = S.tax; $("taxv").textContent = S.tax + "%";
  const active = S.bonds.length; $("bondBtn").disabled = active >= 3;
  $("bondInfo").textContent = active ? `${active} outstanding · $${active * 150}/mo for ${Math.max(...S.bonds.map(b => b.left))} mo` : "Repaid at $150/mo over 8 years";
}
function updateUI() {
  $("sDate").textContent = dateStr(S.day);
  $("sFunds").textContent = money(S.funds); $("sFunds").classList.toggle("neg", S.funds < 0);
  $("sPop").textContent = S.pop.toLocaleString(); $("sJobs").textContent = S.jobs.toLocaleString();
  $("sHappy").textContent = Math.round(S.happy) + "%";
  const c = crews(); $("sCrew").textContent = `${c.free} of ${c.total}`;
  $("titleblock").innerHTML = `<b>City of Millbrook · Master plan</b><br>Scale 1 tile = 1 block · Sheet C-1<br>${S.heat > 0 ? "HEAT ADVISORY · " : ""}${S.net.power.demand.toFixed(0)}/${S.net.power.supply.toFixed(0)} MW · ${S.net.water.demand.toFixed(2)}/${S.net.water.supply.toFixed(2)} MGD`;
  renderWO(); renderGrades(); renderRCI(); renderBudget();
  if (sel) renderInspector();
  document.querySelectorAll(".speed button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.sp === speed));
}

// ─── persistence ─────────────────────────────────────────────────────────────
function serialize() { return JSON.stringify(S); }
function save() { try { localStorage.setItem(SAVE_KEY, serialize()); } catch (e) {} }
function load() { try { const s = localStorage.getItem(SAVE_KEY); if (s) { S = JSON.parse(s); return true; } } catch (e) {} return false; }

// ─── input ───────────────────────────────────────────────────────────────────
function tileAt(e) { const r = cv.getBoundingClientRect(); const x = Math.floor((e.clientX - r.left) / r.width * W), y = Math.floor((e.clientY - r.top) / r.height * H); return inb(x, y) ? { x, y } : null; }
const DRAG = new Set(["road", "ave", "R", "C", "I", "bulldoze", "levee", "repair"]);
cv.addEventListener("pointerdown", e => { const p = tileAt(e); if (!p) return; cv.setPointerCapture(e.pointerId); painting = DRAG.has(tool); lastPaint = idx(p.x, p.y); apply(p.x, p.y); });
cv.addEventListener("pointermove", e => { hover = tileAt(e); if (painting && hover && idx(hover.x, hover.y) !== lastPaint) { lastPaint = idx(hover.x, hover.y); apply(hover.x, hover.y); } });
cv.addEventListener("pointerup", () => { painting = false; });
cv.addEventListener("pointerleave", () => { hover = null; });
document.addEventListener("click", e => {
  const b = e.target.closest("button, .wo-item"); if (!b) return;
  if (b.dataset.tool) setTool(b.dataset.tool);
  else if (b.dataset.ov) { overlay = b.dataset.ov; buildOverlays(); }
  else if (b.dataset.sp != null) { speed = +b.dataset.sp; updateUI(); }
  else if (b.dataset.dispatch) { e.stopPropagation(); dispatch(+b.dataset.dispatch); }
  else if (b.dataset.repair) { const [x, y] = b.dataset.repair.split(",").map(Number); const prev = tool; tool = "repair"; apply(x, y); tool = prev; renderInspector(); }
  else if (b.dataset.goto) { const [x, y] = b.dataset.goto.split(",").map(Number); sel = { x, y }; renderInspector(); }
});
$("tax").addEventListener("input", e => { S.tax = +e.target.value; computeStats(); renderBudget(); renderRCI(); });
$("bondBtn").addEventListener("click", () => { if (S.bonds.length >= 3) return; S.bonds.push({ left: 96 }); S.funds += 10000; log("Issued a $10,000 general obligation bond. Debt service is $150/month."); updateUI(); });
$("helpBtn").addEventListener("click", () => showHelp());
$("newBtn").addEventListener("click", () => {
  modal(`<h3>Start a new city?</h3><p>This replaces Millbrook and everything you've built. The current city can't be recovered.</p><div class="row"><button class="btn hv" id="mYes">Start over</button><button class="btn" id="mNo">Keep playing</button></div>`);
  $("mYes").onclick = () => { newCity(Math.floor(Math.random() * 1e6)); sel = null; closeModal(); buildTools(); buildOverlays(); renderNews(); updateUI(); renderInspector(); save(); };
  $("mNo").onclick = closeModal;
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === " ") { e.preventDefault(); speed = speed ? 0 : 1; updateUI(); return; }
  const t = TOOLS.find(t => t.key === e.key.toLowerCase()); if (t && !(t.unlock && S.pop < t.unlock && S.milestones < 1)) setTool(t.id);
  if (e.key === "Escape") { setTool("inspect"); closeModal(); }
});
function modal(html) { $("modalCard").innerHTML = html; $("modal").hidden = false; }
function closeModal() { $("modal").hidden = true; }
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
function showHelp() {
  modal(`<h3>City Engineer's brief</h3>
  <p>You run public works for Millbrook. Grow the city, and keep its infrastructure standing while you do.</p>
  <ul>
    <li><b>Streets are the right-of-way.</b> Power lines and water and sewer mains run under them. A plant only serves buildings on the street network it touches.</li>
    <li><b>Zones grow</b> when they have a street, power and water. Medium-density blocks need sewer service to go higher.</li>
    <li><b>Everything wears out.</b> Pavement loses condition faster under heavy traffic. Old streets break water mains and open sinkholes. Bridges below NBI 3 close, and if you ignore them they collapse.</li>
    <li><b>Work orders</b> list what's broken. Each repair takes a crew. Build Public Works depots for more crews and cheap preventive maintenance.</li>
    <li><b>Storms</b> flood unprotected riverbanks and knock down power lines. Levees protect riverside blocks and plants.</li>
    <li><b>Traffic</b> is graded by level of service (LOS A to F) from the volume-to-capacity ratio. Widen streets to avenues once they unlock.</li>
  </ul>
  <p>Keys: 1–0 tools, Q inspect, E repair, X demolish, P park, L levee, Space pause.</p>
  <div class="row"><button class="btn hv" id="mOk">Get to work</button></div>`);
  $("mOk").onclick = closeModal;
}

// ─── loop ────────────────────────────────────────────────────────────────────
let acc = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(250, now - last); last = now;
  if (speed && $("modal").hidden) { acc += dt * speed * 2 / 1000; let n = 0; while (acc >= 1 && n < 8) { acc -= 1; n++; day(); } if (n) updateUI(); }
  draw(now);
  requestAnimationFrame(frame);
}
function start(data) {
  let fresh = true;
  if (data && data.state) { try { S = JSON.parse(data.state); fresh = false; } catch (e) {} }
  if (fresh && load()) fresh = false;
  if (fresh) newCity(7);
  computeNetworks(); computeTraffic(); computeStats();
  sizeCanvas(); buildTools(); buildOverlays(); renderNews(); updateUI(); renderInspector();
  if (fresh) { sel = { x: 21, y: 15 }; renderInspector(); }
  requestAnimationFrame(frame);
}
window.addEventListener("resize", sizeCanvas);
try { window.claude?.hot?.snapshot?.(() => ({ state: serialize() })); } catch (e) {}
const hot = window.claude?.hot;
hot?.ready ? hot.ready(start) : start(hot?.data ?? {});
</script>
</body>
</html>
