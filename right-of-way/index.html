<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Right-of-Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,600;0,800;0,900;1,600&family=Overpass+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#E6EAE1; --panel:#F5F6F1; --panel-2:#ECEFE7; --ink:#1E2B38; --ink-2:#56626E; --rule:#C7CEC3;
  --hivis:#E8590C; --hivis-ink:#FFFFFF;
  --good:#2F7D4F; --warn:#B7790A; --bad:#BF3A2B;
  --display:"Overpass","Highway Gothic","Arial Narrow",system-ui,sans-serif;
  --mono:"Overpass Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--display)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--hivis);outline-offset:2px}
.muted{color:var(--ink-2)}

.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-inline:16px;border-bottom:2px solid var(--ink);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.brand h1{margin:0;font-weight:900;font-size:22px;letter-spacing:-.01em;text-transform:uppercase}
.brand h1 span{display:inline-block;background:var(--hivis);color:var(--hivis-ink);padding:0 6px;margin-left:2px;transform:skewX(-8deg)}
.brand small{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat b{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stat b.neg{color:var(--bad)}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.save-state{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.save-state.bad{color:var(--bad)}
.speed{display:flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.speed button{background:transparent;border:0;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer;border-right:1.5px solid var(--ink)}
.speed button:last-child{border-right:0}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

.app{display:grid;grid-template-columns:220px minmax(0,1fr) 330px;gap:14px;padding-inline:16px;padding-block:14px;max-width:1760px;margin:0 auto;align-items:start}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px}
.panel h2{margin:0;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 em{font-style:normal;font-family:var(--mono);font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.pbody{padding:10px 12px}

.tools{display:flex;flex-direction:column;gap:10px}
.tgroup{display:flex;flex-direction:column;gap:3px}
.tgroup > span{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:0 2px}
.tgroup .list{display:flex;flex-direction:column;gap:3px}
.tool{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:4px 7px;cursor:pointer}
.tool:hover{border-color:var(--ink-2)}
.tool[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.tool[disabled]{opacity:.45;cursor:not-allowed}
.tool.pulse{box-shadow:0 0 0 2px var(--hivis);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(232,89,12,.25)}}
.tool .sw{width:22px;height:18px;border-radius:3px;border:1px solid rgba(0,0,0,.25);display:grid;place-items:center;font:600 8.5px/1 var(--mono);color:#1E2B38}
.tool .nm{font-weight:600;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .cs{font-family:var(--mono);font-size:10.5px;opacity:.75;white-space:nowrap}
.tool kbd{font-family:var(--mono);font-size:10px;opacity:.6}
.tooldesc{font-size:12px;color:var(--ink-2);min-height:4.5em}

.mapwrap{display:flex;flex-direction:column;gap:8px;min-width:0}
.maptop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.maptop > span{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-right:4px}
.chip{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.legend{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.canvasbox{position:relative;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:#86B1C4;line-height:0}
canvas#map{width:100%;display:block;touch-action:none;cursor:grab}
.titleblock{position:absolute;right:0;bottom:0;background:rgba(245,246,241,.94);border-left:1.5px solid var(--ink);border-top:1.5px solid var(--ink);font:11px/1.35 var(--mono);padding:5px 9px;pointer-events:none;max-width:70%}
.titleblock b{font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.zoom{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--panel)}
.zoom button{border:0;background:transparent;width:30px;height:28px;font-weight:900;font-size:16px;cursor:pointer;line-height:1}
.zoom button+button{border-top:1.5px solid var(--ink)}
.placebar{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--panel);border-radius:4px;padding:6px 8px 6px 12px;display:flex;gap:8px;align-items:center;font-size:12.5px;line-height:1.3;max-width:calc(100% - 90px)}
.placebar .btn{background:transparent;color:var(--panel);border-color:var(--panel)}
.news{display:flex;flex-direction:column;gap:2px;font-size:12.5px;max-height:130px;overflow:auto;padding:8px 12px}
.news div{display:grid;grid-template-columns:52px 1fr;gap:8px}
.news time{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.news .bad{color:var(--bad);font-weight:600}
.news .good{color:var(--good);font-weight:600}

.side{display:flex;flex-direction:column;gap:12px}
#minimap{width:100%;height:auto;display:block;cursor:pointer;image-rendering:pixelated;border-radius:0 0 6px 6px}
.tut{border:2px solid var(--hivis)}
.tut h2{background:var(--hivis);color:var(--hivis-ink);border-bottom:0}
.tut h2 em{color:var(--hivis-ink);opacity:.85}
.tut h3{margin:0 0 4px;font-size:16px;font-weight:800}
.tut p{margin:0;font-size:13px}
.tut-list{margin:10px 0 0;padding-left:20px;font-size:11.5px;color:var(--ink-2);columns:2;column-gap:18px}
.tut-list li.done{text-decoration:line-through;opacity:.6}
.tut-list li.now{color:var(--hivis);font-weight:800}
.wo{display:flex;flex-direction:column;max-height:330px;overflow:auto}
.wo-item{display:grid;grid-template-columns:4px 1fr auto;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule);align-items:center;cursor:pointer}
.wo-item:last-child{border-bottom:0}
.wo-item:hover{background:var(--panel-2)}
.wo-item .sev{align-self:stretch;border-radius:2px;background:var(--warn)}
.wo-item .sev.s3{background:var(--bad)}.wo-item .sev.s1{background:#8A96A3}
.wo-item b{display:block;font-size:13px}
.wo-item small{display:block;font-size:11.5px;color:var(--ink-2);font-family:var(--mono)}
.btn{border:1.5px solid var(--ink);background:var(--panel);border-radius:4px;padding:4px 9px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;display:inline-block}
.btn:hover{background:var(--panel-2)}
.btn.hv{background:var(--hivis);border-color:var(--hivis);color:var(--hivis-ink)}
.btn.hv:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);text-decoration:underline}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.status-pill{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel-2);border:1px solid var(--rule);white-space:nowrap}
.empty{padding:12px;color:var(--ink-2);font-size:12.5px}

.grades{display:grid;grid-template-columns:1fr auto}
.grades div{padding:6px 12px;border-bottom:1px solid var(--rule);font-size:13px;display:flex;flex-direction:column}
.grades div small{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.grades .g{font:900 20px/1 var(--display);display:grid;place-items:center;width:44px}
.g.A{color:var(--good)}.g.B{color:#5E8C2E}.g.C{color:var(--warn)}.g.D{color:#C8601A}.g.F{color:var(--bad)}.g.NA{color:var(--ink-2);font-size:13px}

.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.kv .tot{border-top:1px solid var(--rule);padding-top:4px;font-weight:600;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row label{font-size:12px;font-weight:600}
input[type=range]{accent-color:var(--hivis);flex:1;min-width:90px}
input[type=checkbox]{accent-color:var(--hivis)}

.rci{display:flex;gap:14px;align-items:flex-end;height:74px;padding:6px 12px 10px}
.rci .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.rci .track{flex:1;width:100%;position:relative;border-left:1px solid var(--rule);border-right:1px solid var(--rule);background:linear-gradient(var(--rule),var(--rule)) center/100% 1px no-repeat}
.rci .fill{position:absolute;left:18%;right:18%;border-radius:2px}
.rci span{font-size:11px;font-weight:800}

.insp{font-size:12.5px}
.insp h3{margin:0 0 4px;font-size:15px;font-weight:800}
.insp p{margin:6px 0 0}
.insp .alert{color:var(--bad)}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--rule);margin:2px 3px 0 0}
.tag.ok{color:var(--good);border-color:currentColor}.tag.no{color:var(--bad);border-color:currentColor}

.modal{position:fixed;inset:0;background:rgba(30,43,56,.5);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.modal .card{background:var(--panel);border:2px solid var(--ink);border-radius:6px;max-width:560px;width:100%;padding:18px 20px;max-height:calc(100vh - 32px);overflow:auto}
.modal .card.wide{max-width:1080px}
.modal h3{margin:0 0 8px;font-size:20px;font-weight:900;text-transform:uppercase;text-wrap:balance}
.modal h3.big{font-size:40px;letter-spacing:-.02em;line-height:1}
.modal .eyebrow{margin:0 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--hivis)}
.modal p,.modal li{font-size:13.5px}
.modal .sub{color:var(--ink-2);margin-top:0}
.modal .small{font-size:12px}
.modal ul{padding-left:18px;margin:8px 0}
.choices{display:grid;gap:8px;margin:14px 0}
.choice{text-align:left;border:1.5px solid var(--ink);background:var(--panel);border-radius:6px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.choice b{font-size:16px;font-weight:900;text-transform:uppercase}
.choice span{font-size:12.5px;color:var(--ink-2)}
.choice.primary{background:var(--ink);color:var(--panel)}
.choice.primary span{color:#C9D1D8}
.choice:hover{border-color:var(--hivis)}
.bids{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bid{border:1px solid var(--rule);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
.bid .pv{width:100%;height:auto;border-radius:3px;border:1px solid var(--rule)}
.bid-h{display:flex;flex-direction:column}
.bid-h b{font-size:14.5px;font-weight:800;line-height:1.2}
.bid-h span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--hivis)}
.bid p{margin:0;font-size:12.5px;color:var(--ink-2);flex:1}
.slots{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px;margin-top:10px}
.slot{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--rule)}
.slot:last-child{border-bottom:0}
.slot > div{flex:1;display:flex;flex-direction:column}
.slot small{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
textarea{width:100%;margin-top:8px;font:12px var(--mono);border:1px solid var(--rule);border-radius:4px;padding:6px}

@media (max-width:1240px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .side{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));align-items:start}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .mapwrap{order:-1}
  .tools{flex-direction:row;flex-wrap:wrap}
  .tgroup{flex:1 1 100%}
  .tgroup .list{flex-direction:row;flex-wrap:wrap;gap:4px}
  .tool{width:auto;grid-template-columns:18px auto auto}
  .tool .sw{width:18px}
  .tool kbd{display:none}
  .legend{margin-left:0}
  .brand{margin-right:0;width:100%}
  .modal h3.big{font-size:30px}
  .tut-list{columns:1}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><h1>Right<span>of Way</span></h1><small>City of Bayford · Dept. of Public Works</small></div>
  <div class="stats">
    <div class="stat"><b id="sDate">—</b><i>Date</i></div>
    <div class="stat"><b id="sFunds">—</b><i>Treasury</i></div>
    <div class="stat"><b id="sPop">—</b><i>Residents</i></div>
    <div class="stat"><b id="sJobs">—</b><i>Jobs</i></div>
    <div class="stat"><b id="sHappy">—</b><i>Approval</i></div>
    <div class="stat"><b id="sCommute">—</b><i>Commute</i></div>
  </div>
  <div class="hdr-actions">
    <span class="save-state" id="saveState"></span>
    <button class="btn" id="saveBtn">Save</button>
    <div class="speed" role="group" aria-label="Simulation speed">
      <button data-sp="0">Pause</button><button data-sp="1">1×</button><button data-sp="3">3×</button>
    </div>
  </div>
</header>

<main class="app">
  <aside class="panel">
    <h2>Toolbox</h2>
    <div class="pbody">
      <div class="tools" id="tools"></div>
      <p class="tooldesc" id="toolDesc"></p>
      <div class="row"><button class="btn" id="helpBtn">Handbook</button><button class="btn" id="newBtn">New city</button></div>
    </div>
  </aside>

  <section class="mapwrap">
    <div class="maptop" id="overlays"></div>
    <div class="canvasbox">
      <canvas id="map" aria-label="Map of Bayford"></canvas>
      <div class="zoom"><button data-zoom="in" aria-label="Zoom in">+</button><button data-zoom="out" aria-label="Zoom out">−</button></div>
      <div class="placebar" id="placeBar" hidden><span id="placeText"></span><button class="btn" id="placeRotate">Rotate</button><button class="btn" id="placeCancel">Cancel</button></div>
      <div class="titleblock" id="titleblock"></div>
    </div>
    <div class="panel"><h2>Dispatch log <em>newest first</em></h2><div class="news" id="news"></div></div>
  </section>

  <aside class="side">
    <div class="panel tut" id="tutPanel" hidden>
      <h2>Orders from the Mayor <em id="tutCount"></em></h2>
      <div class="pbody" id="tutBody"></div>
    </div>
    <div class="panel">
      <h2>Region map <em>click to jump</em></h2>
      <canvas id="minimap" width="336" height="240" aria-label="Region overview map"></canvas>
    </div>
    <div class="panel">
      <h2>Work orders <em id="woCount"></em></h2>
      <div class="wo" id="wo"></div>
    </div>
    <div class="panel">
      <h2>Inspector <em id="inspXY"></em></h2>
      <div class="pbody insp" id="insp"></div>
    </div>
    <div class="panel">
      <h2>Infrastructure report card <em id="gpa"></em></h2>
      <div class="grades" id="grades"></div>
    </div>
    <div class="panel">
      <h2>Zoning demand</h2>
      <div class="rci" id="rci"></div>
    </div>
    <div class="panel">
      <h2>Monthly budget <em id="budgetMonth"></em></h2>
      <div class="pbody">
        <dl class="kv" id="budget"></dl>
        <div class="row"><label for="tax">Property tax</label><input type="range" id="tax" min="5" max="15" step="1"><b id="taxv" style="font-family:var(--mono)"></b></div>
        <div class="row"><input type="checkbox" id="snowBudget"><label for="snowBudget">Fund snow &amp; ice removal</label></div>
        <div class="row"><button class="btn" id="bondBtn">Issue $10k bond</button><small id="bondInfo" class="muted" style="font-size:11.5px"></small></div>
      </div>
    </div>
  </aside>
</main>

<div class="modal" id="modal" hidden><div class="card" id="modalCard"></div></div>

<script src="src/data.js"></script>
<script src="src/world.js"></script>
<script src="src/sim.js"></script>
<script src="src/projects.js"></script>
<script src="src/render.js"></script>
<script src="src/save.js"></script>
<script src="src/tutorial.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
