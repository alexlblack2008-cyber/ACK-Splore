<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
  </style>
</helmet>
<div style="width:520px;height:800px;background:#eae5da;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0;font-family:Georgia,'Times New Roman',serif;">
  <div style="width:440px;height:600px;background:#1b140f;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,0.28), inset 0 2px 0 rgba(255,255,255,0.35);">
    <svg viewBox="0 0 404 564" width="404" height="564" style="display:block;">
      <rect x="0" y="0" width="404" height="564" fill="#1c3550"/>
      <rect x="0" y="0" width="404" height="260" fill="#24405e"/>

      <!-- cloak / torso -->
      <path d="M120,564 Q100,420 130,340 Q150,260 210,240 Q270,255 290,330 Q310,420 300,564 Z" fill="#2c5478" stroke="#0c1c2c" stroke-width="6"/>
      <path d="M150,330 Q180,300 220,310 Q210,360 170,370 Z" fill="#14283f" opacity="0.8"/>
      <path d="M230,320 Q270,310 285,350 Q255,380 225,360 Z" fill="#14283f" opacity="0.7"/>

      <!-- arms -->
      <path d="M150,300 Q120,350 130,410 Q140,440 170,450 L180,430 Q155,415 150,385 Q148,340 170,310 Z" fill="#2c5478" stroke="#0c1c2c" stroke-width="5"/>
      <path d="M260,300 Q295,345 285,410 Q278,440 250,452 L242,430 Q265,415 268,385 Q270,340 250,310 Z" fill="#2c5478" stroke="#0c1c2c" stroke-width="5"/>

      <!-- guitar -->
      <circle cx="205" cy="430" r="55" fill="#a9c4d8" stroke="#0c1c2c" stroke-width="5"/>
      <circle cx="205" cy="370" r="38" fill="#a9c4d8" stroke="#0c1c2c" stroke-width="5"/>
      <circle cx="205" cy="405" r="14" fill="#14283f"/>
      <rect x="196" y="270" width="18" height="110" rx="3" fill="#7fa0bd" stroke="#0c1c2c" stroke-width="4"/>
      <rect x="188" y="250" width="34" height="24" rx="3" fill="#7fa0bd" stroke="#0c1c2c" stroke-width="4"/>

      <!-- lap / legs -->
      <path d="M130,470 Q200,510 300,470 L300,564 L110,564 Z" fill="#14283f" opacity="0.9"/>

      <!-- head, tilted forward -->
      <g transform="rotate(12 205 170)">
        <ellipse cx="205" cy="170" rx="42" ry="48" fill="#4a7ba0" stroke="#0c1c2c" stroke-width="6"/>
        <path d="M165,150 Q170,110 210,105 Q250,112 250,150 Q230,130 205,132 Q180,132 165,150 Z" fill="#14283f"/>
        <ellipse cx="190" cy="195" rx="16" ry="10" fill="#14283f" opacity="0.35"/>
        <path d="M195,175 Q205,182 218,175" stroke="#0c1c2c" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M195,205 Q205,210 213,204" stroke="#0c1c2c" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>

      <rect x="0" y="540" width="404" height="24" fill="#0c1c2c" opacity="0.5"/>
    </svg>
  </div>
  <div style="margin-top:22px;text-align:center;max-width:380px;">
    <div style="font-style:italic;font-size:18px;color:#2a2420;letter-spacing:0.3px;">The Guitarist (Study)</div>
    <div style="font-size:11px;color:#6b6258;margin-top:6px;letter-spacing:0.6px;text-transform:uppercase;">Original sketch &middot; in the manner of Picasso &middot; Blue Period</div>
  </div>
</div>
</x-dc>
</body>
</html>
