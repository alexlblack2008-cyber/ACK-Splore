name: Zone Model — Intel Monitor

on:
  schedule:
    # Every 3 hours — catches breaking injuries, trades, locker room news
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scrape-intel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt || echo "No extra dependencies needed"

      - name: Scrape reporter intel
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: |
          cd zone_model
          python intel_scraper.py

      - name: Commit intel update
        run: |
          git config user.name "Zone Model Bot"
          git config user.email "actions@github.com"
          git add zone_model/player_intel.json
          git diff --cached --quiet || git commit -m "chore: intel update $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          git push
