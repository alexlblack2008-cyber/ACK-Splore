name: Zone Model — Daily Picks

on:
  schedule:
    # 11:45 AM ET = 16:45 UTC  (ahead of noon runner congestion)
    - cron: '45 16 * * *'
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  run-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt || echo "No extra dependencies needed"

      - name: Auto-settle yesterday's picks
        run: |
          cd zone_model
          python auto_settle.py

      - name: Refresh umpire profiles
        run: |
          cd zone_model
          python update_umpire_data.py || echo "Umpire update failed — continuing with cached profiles"

      - name: Update coach and team season stats
        run: |
          cd zone_model
          python update_coach_data.py || echo "Coach data update failed — continuing with cached stats"

      - name: Run Zone Model pipeline
        env:
          ODDS_API_KEY:        ${{ secrets.ODDS_API_KEY }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM:          ${{ secrets.GMAIL_FROM }}
          GMAIL_TO:            ${{ secrets.GMAIL_TO }}
          BANKROLL:            "1000"
        run: |
          cd zone_model
          python validate_api_key.py
          python cron_entry.py

      - name: Noon umpire enrichment pass
        run: |
          cd zone_model
          python enrich_umpires.py || echo "Umpire enrichment skipped"

      - name: Commit updated ledger
        run: |
          git config user.name "Zone Model Bot"
          git config user.email "actions@github.com"
          git add zone_model/ledger.json zone_model/umpire_data.py zone_model/coach_season_stats.json || true
          date -u +"%Y-%m-%dT%H:%M:%SZ" > zone_model/.last_run
          git add zone_model/.last_run
          git diff --cached --quiet || git commit -m "chore: daily picks run $(date -u +%Y-%m-%d) [skip ci]"
          git push
